name: upstream-watch

# Free drift signal. The drift canary proves whether a scraper still works but
# costs an API call per tool per run, and transcript formats do not change
# daily — they change when a tool ships a release. So this checks npm weekly and
# opens or updates one rolling draft PR bumping `.github/upstream-versions.json`
# when tracked tools ship new releases, keeping the Issues tab for real bugs.

on:
  schedule:
    - cron: "30 6 * * 1" # Mondays at 06:30 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: upstream-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Check tracked upstream versions
        id: check
        run: |
          set +e
          node scripts/check-upstream-versions.mjs --write | tee upstream-report.txt
          echo "exit_code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      - name: Build rolling PR title and body
        id: meta
        if: steps.check.outputs.exit_code == '10'
        run: |
          set -euo pipefail
          versions=$(grep '^MOVED' upstream-report.txt | sed 's/.*-> //' | paste -sd, -)
          echo "title=chore(upstream): bump tracked coding tool versions (${versions})" >> "$GITHUB_OUTPUT"
          {
            echo "Tracked coding tools published new releases since the versions currently verified in \`.github/upstream-versions.json\`."
            echo ""
            echo "This draft PR is **not** evidence that anything is broken — it marks when on-disk formats *could* have changed so you can verify before merging."
            echo ""
            echo '```'
            cat upstream-report.txt
            echo '```'
            echo ""
            echo "### Before marking Ready for Review"
            echo ""
            echo "1. Update the changed tool(s) locally and run a session so a fresh transcript is written."
            echo "2. Run \`npm run capture:formats\` to diff field shapes against \`tests/drift/fingerprints/\`."
            echo "3. If any field shape changed, update the scraper in \`src/scrapers/\` and run \`npm run capture:formats -- --write\`."
            echo "4. Or dispatch \`drift-canary\` manually for an end-to-end check."
            echo ""
            echo "**Run:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          } > pr-body.md

      - name: Push rolling version-bump branch and upsert draft PR
        if: steps.check.outputs.exit_code == '10'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TITLE: ${{ steps.meta.outputs.title }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B chore/upstream-versions
          git add .github/upstream-versions.json
          if git diff --cached --quiet; then
            echo "No changes to .github/upstream-versions.json; skipping PR update."
            exit 0
          fi
          git commit -m "$TITLE"
          git push --force origin HEAD:refs/heads/chore/upstream-versions

          existing=$(gh pr list --state open --base main --head chore/upstream-versions --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh api -X PATCH "repos/${GITHUB_REPOSITORY}/pulls/${existing}" -f title="$TITLE" -F body=@pr-body.md >/dev/null
            echo "Updated rolling draft PR #${existing}"
          else
            gh pr create --draft --base main --head chore/upstream-versions --title "$TITLE" --body-file pr-body.md --label drift --label upstream
          fi

      - name: Fail on check errors
        # 0 = current, 10 = something moved (handled above). Anything else is
        # the check itself failing, which should be visible rather than quiet.
        if: steps.check.outputs.exit_code != '0' && steps.check.outputs.exit_code != '10'
        run: |
          echo "upstream check exited ${{ steps.check.outputs.exit_code }}" >&2
          exit 1
