name: cloud-image

on:
  push:
    branches: [main]
    paths:
      - "cloud/**"
      - ".github/workflows/cloud-image.yml"
  workflow_dispatch:
    inputs:
      tag:
        description: "Optional extra tag to publish (e.g. latest or v0.23.0)"
        required: false
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: cloud-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Log in to GitHub Container Registry
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_ACTOR: ${{ github.actor }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_ACTOR" --password-stdin

      - name: Build and push cloud image
        env:
          EVENT_NAME: ${{ github.event_name }}
          EXTRA_TAG: ${{ inputs.tag }}
          REPO_OWNER: ${{ github.repository_owner }}
          REPO_FULL: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          owner="$(printf '%s' "$REPO_OWNER" | tr '[:upper:]' '[:lower:]')"
          short_sha="$(printf '%s' "$COMMIT_SHA" | cut -c1-12)"
          image="ghcr.io/${owner}/xtctx-cloud"
          tag_args=(--tag "${image}:sha-${short_sha}")

          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ -n "$EXTRA_TAG" ]; then
            if [[ ! "$EXTRA_TAG" =~ ^[A-Za-z0-9._-]+$ ]]; then
              echo "Invalid tag: must match ^[A-Za-z0-9._-]+$" >&2
              exit 1
            fi
            tag_args+=(--tag "${image}:${EXTRA_TAG}")
          fi

          docker buildx build \
            --platform linux/amd64 \
            --file cloud/Dockerfile \
            --label "org.opencontainers.image.source=https://github.com/${REPO_FULL}" \
            --label "org.opencontainers.image.revision=${COMMIT_SHA}" \
            --label "org.opencontainers.image.licenses=MIT" \
            "${tag_args[@]}" \
            --push \
            .
