name: publish

on:
  release:
    types:
      - published

permissions:
  contents: read
  id-token: write

jobs:
  publish-npm:
    if: github.event.release.prerelease == false
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            landing/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Install landing dependencies
        run: npm --prefix landing ci

      - name: Print package identity
        run: node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('package.json','utf8'));console.log(`Publishing ${p.name}@${p.version}`);"

      - name: Verify release
        run: npm run verify:release

      - name: Publish to npm (OIDC trusted publishing)
        run: npm publish --provenance --access public
