name: publish

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type publish to publish package.json version from this ref via OIDC"
        required: true
        type: string

permissions:
  contents: read
  id-token: write

# Never run two publishes concurrently; never cancel one mid-publish.
concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish-npm:
    if: >
      (github.event_name == 'release' && github.event.release.prerelease == false) ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.confirm == 'publish')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            landing/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Install landing dependencies
        run: npm --prefix landing ci

      - name: Print package identity
        run: node -e 'const fs=require("fs");const p=JSON.parse(fs.readFileSync("package.json","utf8"));console.log("Publishing "+p.name+"@"+p.version);'

      - name: Verify tag matches package.json version
        if: github.event_name == 'release'
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          version=$(node -p 'require("./package.json").version')
          expected="xtctx-v${version}"
          if [ "$RELEASE_TAG" != "$expected" ] && [ "$RELEASE_TAG" != "v${version}" ]; then
            echo "Release tag '$RELEASE_TAG' does not match package.json version '${version}'." >&2
            exit 1
          fi

      - name: Verify release
        run: npm run verify:release

      - name: Publish to npm (OIDC trusted publishing)
        run: npm publish --provenance --access public

  # A deploy is not done until its health is observed: install the published
  # version from the registry and smoke it. Failure here pages via the
  # workflow failure notification and is the trigger to follow RELEASE.md's
  # rollback section.
  post-publish-smoke:
    needs: publish-npm
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # Deliberately no checkout. `npx xtctx` inside the repo resolves the
      # *local* package — package.json declares the `xtctx` bin as
      # dist/src/cli/index.js, which is unbuilt here — so the smoke reported
      # `sh: 1: xtctx: not found` while the published package was perfectly
      # fine. Worse than the false alarm: with a built dist present it would
      # have exercised the working tree and passed without ever touching the
      # registry, which is the one thing this job exists to check.
      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24

      - name: Smoke the published package from the registry
        working-directory: ${{ runner.temp }}
        env:
          # The tag is the source of truth for what was just released; reading
          # a version out of the repo would mean checking the repo out again.
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          version="${RELEASE_TAG#xtctx-v}"
          version="${version#v}"
          if [ -z "$version" ]; then
            echo "Could not derive a version from tag '$RELEASE_TAG'." >&2
            exit 1
          fi

          echo "Waiting for xtctx@${version} to be visible on the registry..."
          for attempt in 1 2 3 4 5 6; do
            if npm view "xtctx@${version}" version >/dev/null 2>&1; then
              break
            fi
            if [ "$attempt" = "6" ]; then
              echo "xtctx@${version} never became visible on the registry." >&2
              exit 1
            fi
            sleep 20
          done

          npx -y "xtctx@${version}" --help
          installed=$(npx -y "xtctx@${version}" --version)
          echo "installed version: ${installed}"
          if [ "$installed" != "$version" ]; then
            echo "Published package reports '${installed}', expected '${version}'." >&2
            exit 1
          fi
