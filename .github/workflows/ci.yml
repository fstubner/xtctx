name: ci

on:
  push:
    branches: [main, dev, "release-please--**"]
  pull_request:
    branches: [main, dev]

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            landing/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Install landing dependencies
        run: npm --prefix landing ci

      - name: Unit and integration tests
        run: |
          npm run lint
          npm test
          npm run test:integration

      - name: Root security tests and checklist
        run: |
          npm run test:security
          npm run security:checklist
          npm audit --omit=dev

      - name: Landing dependency audit
        run: npm --prefix landing audit --omit=dev

      - name: Drift canary
        run: npm run test:drift

      - name: Build package
        run: npm run build

      - name: Build landing
        run: npm --prefix landing run build

      - name: CLI smoke check
        run: npm run smoke:cli

      - name: Package dry run
        run: npm pack --dry-run
