name: ci

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

# This workflow runs on pull_request and executes dependency install scripts;
# it must never hold a writable token.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Everything whose behaviour depends on the host OS: path handling and
  # store-directory encoding (Claude Code encodes a POSIX root with a leading
  # separator and a Windows one with a drive letter), the better-sqlite3
  # native build, and the CLI entry point. Running only on Linux previously
  # let a bug ship that made every macOS and Linux project scrape zero
  # sessions, because the fixtures and the developer's machine are Windows.
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install root dependencies
        run: npm ci

      # Every job here loads the real embedding model, so each one pulls the
      # 86MB MiniLM from HuggingFace: four jobs a run, and HuggingFace starts
      # answering 429. That blocked a merge on 2026-08-28 with nothing wrong
      # in the code. (The default briefly moved to the larger mpnet and was
      # moved back on 2026-08-30; the cache is worth keeping either way.)
      #
      # transformers.js caches inside its own package directory and honours no
      # override for it, so this has to run *after* `npm ci` — which deletes
      # node_modules, and the cache with it.
      #
      # Keyed on embeddings.ts because that is where the model and its weight
      # precision are named: change either and the key changes, so a stale
      # model can never be served to a new configuration. Editing that file
      # for anything else costs one download.
      - name: Cache the embedding model
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules/@huggingface/transformers/.cache
          key: hf-model-${{ runner.os }}-${{ hashFiles('src/handoff/embeddings.ts') }}

      - name: Local CI portable lane
        run: npm run ci:local -- --lane portable

  # OS-independent gates: linting, security, dependency audits, the site, and
  # packaging. Running these once keeps the matrix cheap.
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The site's check:changelog asks git whether every dated CHANGELOG
          # version is tagged, and fails rather than skipping when it can see
          # no tags; the default shallow clone has none.
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            site/package-lock.json
            cloud/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Install site dependencies
        run: npm --prefix site ci

      - name: Install cloud dependencies
        run: npm --prefix cloud ci

      # Every job here loads the real embedding model, so each one pulls the
      # 86MB MiniLM from HuggingFace: four jobs a run, and HuggingFace starts
      # answering 429. That blocked a merge on 2026-08-28 with nothing wrong
      # in the code. (The default briefly moved to the larger mpnet and was
      # moved back on 2026-08-30; the cache is worth keeping either way.)
      #
      # transformers.js caches inside its own package directory and honours no
      # override for it, so this has to run *after* `npm ci` — which deletes
      # node_modules, and the cache with it.
      #
      # Keyed on embeddings.ts because that is where the model and its weight
      # precision are named: change either and the key changes, so a stale
      # model can never be served to a new configuration. Editing that file
      # for anything else costs one download.
      - name: Cache the embedding model
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules/@huggingface/transformers/.cache
          key: hf-model-${{ runner.os }}-${{ hashFiles('src/handoff/embeddings.ts') }}

      - name: Local CI checks lane
        run: npm run ci:local -- --lane checks

  semantic-search:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: xtctx
          POSTGRES_PASSWORD: xtctx
          POSTGRES_DB: xtctx
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U xtctx -d xtctx"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: cloud/package-lock.json
      - name: Install cloud dependencies
        run: npm --prefix cloud ci
      - name: Local CI semantic & Postgres lane
        env:
          TEST_DATABASE_URL: postgresql://xtctx:xtctx@127.0.0.1:5432/xtctx
        run: npm run ci:local -- --lane semantic

  # Aggregate gate. Branch protection on `main` requires a check named
  # `test-and-build`, so that name has to keep reporting — splitting the old
  # single job into `test` + `checks` silently removed it and would have
  # blocked every future pull request, not just the one that made the change.
  # Depending on the matrix here also makes each platform effectively
  # required, without editing repository settings to do it.
  test-and-build:
    if: always()
    needs: [test, checks, semantic-search]
    runs-on: ubuntu-latest
    steps:
      - name: Verify every job succeeded
        run: |
          echo "test=${{ needs.test.result }} checks=${{ needs.checks.result }} semantic=${{ needs.semantic-search.result }}"
          if [ "${{ needs.test.result }}" != "success" ] || [ "${{ needs.checks.result }}" != "success" ] || [ "${{ needs.semantic-search.result }}" != "success" ]; then
            echo "One or more required jobs did not succeed." >&2
            exit 1
          fi
