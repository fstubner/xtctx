name: auto-merge-release-pr

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  enable-auto-merge:
    # The author check matters: without it, anyone with push access could
    # name a branch release-please--* and receive standing auto-merge to main.
    if: >
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.event.pull_request.head.ref, 'release-please--') &&
      contains(fromJSON('["github-actions[bot]", "fstubner"]'), github.event.pull_request.user.login) &&
      github.event.pull_request.state == 'open' &&
      github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - name: Enable auto-merge for release PR
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          # Must be the PAT, not GITHUB_TOKEN: the merge this enables is
          # attributed to whoever enabled it, and a push made with
          # GITHUB_TOKEN triggers no further workflows. With the default
          # token the release PR merged and then nothing ran — no
          # release-please, so no release, so no publish. The chain stalled
          # silently at the last step, which is the failure this whole
          # workflow exists to automate away.
          github-token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          script: |
            const pr = context.payload.pull_request;
            if (!pr) {
              core.setFailed("No pull request payload found.");
              return;
            }

            if (pr.auto_merge) {
              core.info(`Auto-merge already enabled for PR #${pr.number}.`);
              return;
            }

            try {
              await github.graphql(
                `
                mutation EnableAutoMerge($pullRequestId: ID!) {
                  enablePullRequestAutoMerge(
                    input: { pullRequestId: $pullRequestId, mergeMethod: MERGE }
                  ) {
                    pullRequest {
                      number
                    }
                  }
                }
                `,
                { pullRequestId: pr.node_id },
              );

              core.info(`Enabled auto-merge for release PR #${pr.number}.`);
            } catch (error) {
              core.setFailed(`Failed to enable auto-merge for PR #${pr.number}: ${error}`);
            }
