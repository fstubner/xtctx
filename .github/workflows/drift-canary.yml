name: drift-canary

# Runs the real AI CLI tools against a scripted prompt, then runs xtctx's
# scrapers against the actual storage those tools wrote. Catches upstream drift
# that synthetic fixtures cannot.
#
# Manual only, deliberately. Every run spends real API credits, and this used to
# run nightly whether or not anything upstream had changed — paying every night
# for a signal that only matters after a release. `upstream-watch` now does the
# nightly watching for free and says when it is worth looking; this is the
# stronger check a human reaches for once it has.
#
# It is also intentionally NOT part of ci.yml: real-API dependencies must not
# gate PRs.

on:
  workflow_dispatch:
    inputs:
      tool:
        description: "Which tool to run (or 'all')"
        required: false
        default: "all"
        type: choice
        options:
          - all
          - claude-code
          - codex

permissions:
  contents: read

jobs:
  canary:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        tool: [claude-code, codex]
    steps:
      - name: Skip tool when workflow_dispatch selects a single one
        if: >
          github.event_name == 'workflow_dispatch' &&
          github.event.inputs.tool != 'all' &&
          github.event.inputs.tool != matrix.tool
        run: echo "Skipping ${{ matrix.tool }} (manually scoped to ${{ github.event.inputs.tool }})" && exit 0

      - name: Checkout
        if: >
          github.event_name != 'workflow_dispatch' ||
          github.event.inputs.tool == 'all' ||
          github.event.inputs.tool == matrix.tool
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        if: >
          github.event_name != 'workflow_dispatch' ||
          github.event.inputs.tool == 'all' ||
          github.event.inputs.tool == matrix.tool
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install xtctx deps and build
        if: >
          github.event_name != 'workflow_dispatch' ||
          github.event.inputs.tool == 'all' ||
          github.event.inputs.tool == matrix.tool
        run: |
          npm ci
          npm run build

      - name: Install claude-code CLI
        if: matrix.tool == 'claude-code'
        run: npm i -g @anthropic-ai/claude-code

      - name: Install codex CLI
        if: matrix.tool == 'codex'
        run: npm i -g @openai/codex

      - name: Run canary (${{ matrix.tool }})
        id: canary
        if: >
          github.event_name != 'workflow_dispatch' ||
          github.event.inputs.tool == 'all' ||
          github.event.inputs.tool == matrix.tool
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          set +e
          node scripts/drift-canary.mjs --tool ${{ matrix.tool }} 2>canary-stderr.log | tee canary-stdout.log
          # $? after a pipeline is tee's status; the canary's own status is in PIPESTATUS[0].
          echo "exit_code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      # No issue is filed on failure any more. Filing was for the unattended
      # nightly run; a dispatch is started by a person who is already watching
      # the run, and `upstream-watch` is what files issues now.

      # 78 means the canary could not run at all — no API key — which is a
      # configuration gap, not upstream drift. Surfaced as a warning so it is
      # visible in the run summary without turning the nightly job red and
      # without filing an issue that says the scraper is broken.
      - name: Note that the canary was skipped
        if: steps.canary.outputs.exit_code == '78'
        run: |
          echo "::warning title=drift canary skipped::${{ matrix.tool }} did not run — its API key is not configured, so this run produced no drift signal for it."
          cat canary-stderr.log || true

      - name: Fail job on canary failure
        # exit_code is empty when the canary step was skipped by a scoped dispatch.
        if: >
          steps.canary.outputs.exit_code != '' &&
          steps.canary.outputs.exit_code != '0' &&
          steps.canary.outputs.exit_code != '78'
        run: |
          echo "canary exited ${{ steps.canary.outputs.exit_code }}"
          exit 1
