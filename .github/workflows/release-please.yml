name: release-please

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - name: Require RELEASE_PLEASE_TOKEN
        # Events created with the default GITHUB_TOKEN do not trigger other
        # workflows, so falling back to it silently stalls the whole chain:
        # no CI on the release branch, no auto-merge, no publish on release.
        # Fail loudly instead.
        #
        # The check lives in `run`, not `if`: the `secrets` context is not
        # available to step-level `if` expressions, and referencing it there
        # makes the whole workflow file invalid — which took the release
        # pipeline down rather than guarding it.
        env:
          RELEASE_PLEASE_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
        run: |
          if [ -z "$RELEASE_PLEASE_TOKEN" ]; then
            echo "RELEASE_PLEASE_TOKEN is not configured. Without it, the release PR," \
                 "auto-merge, and publish workflows will never trigger." >&2
            exit 1
          fi
          echo "RELEASE_PLEASE_TOKEN is configured."

      - name: Run Release Please
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v4
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: .release-please-config.json
          manifest-file: .release-please-manifest.json
