changelog:
  categories:
    - title: Features
      labels:
        - feat
    - title: Bug Fixes
      labels:
        - fix
    - title: Documentation
      labels:
        - docs
    - title: Tests
      labels:
        - test
    - title: Miscellaneous
      labels:
        - "*"
template: |
  ## Changes

  $CHANGES

  ## Post-release checklist

  - [ ] CLI install smoke: `npx xtctx --help`
  - [ ] Setup smoke: `npx -y xtctx setup --yes`
  - [ ] Status smoke: `npx -y xtctx status`
  - [ ] MCP smoke: configure a local MCP client with command `npx` and args `["-y", "xtctx"]`
