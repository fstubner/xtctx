name = "xtctx-cloud"
main = "src/index.ts"
compatibility_date = "2026-07-28"
# global_fetch_strictly_public: the OAuth provider fetches Client ID Metadata
# Documents from URLs a client names; this keeps those fetches on the public
# internet (SSRF protection), and the provider only advertises CIMD with it.
compatibility_flags = ["nodejs_compat", "global_fetch_strictly_public"]
# Self-hosted: there is no hosted xtctx service, and this file deploys to no
# domain of the project's. To run your own instance, copy
# wrangler.local.example.toml to wrangler.local.toml (git-ignored), fill in the
# values it marks REPLACE, and deploy with `--config wrangler.local.toml`; see
# README.md. Keep workers_dev = false: a *.workers.dev alias would answer with
# a different origin than the one tokens are bound to.
workers_dev = false

[observability]
enabled = true

# D1: sessions, messages, accounts, revocation epochs.
# Schema: `npm run d1:migrate:remote` (wrangler d1 migrations apply).
# Create your own with `npx wrangler d1 create xtctx-db` and put ITS database_id
# below; the one shipped here belongs to the project's own account, not yours.
[[d1_databases]]
binding = "DB"
database_name = "xtctx-db"
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"
migrations_dir = "migrations"

# KV: OAuth grants, tokens and registered clients (workers-oauth-provider).
# Create it with `npx wrangler kv namespace create OAUTH_KV` and put the id here.
[[kv_namespaces]]
binding = "OAUTH_KV"
id = "REPLACE_WITH_OAUTH_KV_NAMESPACE_ID"

# Holds the open SSE streams for the baseline MCP transport.
[[durable_objects.bindings]]
name = "SSE"
class_name = "SseSession"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["SseSession"]

[vars]
# REQUIRED: replace with the origin your Worker is served from (no path), e.g.
# "https://xtctx-sync.example.com". MCP clients connect to PUBLIC_URL + "/mcp",
# every token is bound to it, and `xtctx login --sync-url` takes the same
# origin. While it is still the placeholder below the Worker answers every
# route except /health with 500 server_misconfigured.
PUBLIC_URL = "https://REPLACE-WITH-YOUR-WORKER-URL.invalid"
# Client id of YOUR GitHub OAuth App (device flow for the CLI, web flow for
# /authorize); see cloud/README.md. The id shipped here is the project's own
# app, whose callback is not your PUBLIC_URL, so replace it.
GITHUB_CLIENT_ID = "REPLACE_WITH_YOUR_GITHUB_OAUTH_CLIENT_ID"
# Comma-separated numeric GitHub user ids allowed to sign in. Empty means
# nobody can (fail closed). Find yours: https://api.github.com/users/<login> -> "id".
ALLOWED_GITHUB_IDS = ""
ENVIRONMENT = "production"

# Secrets, set with `npx wrangler secret put <NAME>`:
# - JWT_SECRET: REQUIRED. Signs the CLI's tokens; every route but /health answers 500 until it is set.
# - GITHUB_CLIENT_SECRET: needed for browser sign-in at /authorize (MCP clients). Without it the
#   CLI's device flow still works and /authorize answers 503.
# Optional var: ALLOWED_ORIGINS (comma-separated browser origins to send CORS headers to; none by default).
