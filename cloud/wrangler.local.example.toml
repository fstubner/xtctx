# Your own deployment of the xtctx cloud Worker. xtctx runs no hosted service:
# the Worker is yours, on your Cloudflare account, for the GitHub accounts you
# allow.
#
#   cp wrangler.local.example.toml wrangler.local.toml    (git-ignored)
#
# then replace every REPLACE below. Deploy and migrate with this file:
#
#   npx wrangler d1 migrations apply xtctx-db --remote --config wrangler.local.toml
#   npx wrangler deploy --config wrangler.local.toml
#
# cloud/README.md walks through creating the D1 database, the KV namespace,
# the GitHub OAuth app and the secrets. This file is the same as wrangler.toml
# apart from the REPLACE lines and the route; tests/ fail if the two drift.
name = "xtctx-cloud"
main = "src/index.ts"
compatibility_date = "2026-07-28"
# global_fetch_strictly_public: the OAuth provider fetches Client ID Metadata
# Documents from URLs a client names; this keeps those fetches on the public
# internet (SSRF protection), and the provider only advertises CIMD with it.
compatibility_flags = ["nodejs_compat", "global_fetch_strictly_public"]
# Only your custom domain serves this Worker; no *.workers.dev alias that would
# answer with a different origin than the one tokens are bound to.
workers_dev = false

# The domain you serve the Worker from, on a zone in your Cloudflare account.
# For example "xtctx-sync.example.com"; it is the host of PUBLIC_URL below.
routes = [
  { pattern = "REPLACE-WITH-YOUR-DOMAIN", custom_domain = true }
]

[observability]
enabled = true

# D1: sessions, messages, accounts, revocation epochs.
# Create it with `npx wrangler d1 create xtctx-db` and put the printed id here.
[[d1_databases]]
binding = "DB"
database_name = "xtctx-db"
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"
migrations_dir = "migrations"

# KV: OAuth grants, tokens and registered clients (workers-oauth-provider).
# Create it with `npx wrangler kv namespace create OAUTH_KV` and put the id here.
[[kv_namespaces]]
binding = "OAUTH_KV"
id = "REPLACE_WITH_OAUTH_KV_NAMESPACE_ID"

# Holds the open SSE streams for the baseline MCP transport.
[[durable_objects.bindings]]
name = "SSE"
class_name = "SseSession"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["SseSession"]

[vars]
# The origin of the domain above, with no path, e.g.
# "https://xtctx-sync.example.com". MCP clients connect to PUBLIC_URL + "/mcp",
# every token is bound to it, and `xtctx login --sync-url` takes the same
# origin. While it is still the placeholder below the Worker answers every
# route except /health with 500 server_misconfigured.
PUBLIC_URL = "https://REPLACE-WITH-YOUR-WORKER-URL.invalid"
# Client id of YOUR GitHub OAuth App (device flow for the CLI, web flow for /authorize).
GITHUB_CLIENT_ID = "REPLACE_WITH_YOUR_GITHUB_OAUTH_CLIENT_ID"
# Comma-separated numeric GitHub user ids allowed to sign in, e.g. "12345678".
# Empty means nobody can (fail closed). Find yours: https://api.github.com/users/<login> -> "id".
ALLOWED_GITHUB_IDS = "REPLACE_WITH_YOUR_NUMERIC_GITHUB_ID"
ENVIRONMENT = "production"

# Secrets, set with `npx wrangler secret put <NAME> --config wrangler.local.toml`:
# - JWT_SECRET: REQUIRED. Signs the CLI's tokens; every route but /health answers 500 until it is set.
# - GITHUB_CLIENT_SECRET: needed for browser sign-in at /authorize (MCP clients). Without it the
#   CLI's device flow still works and /authorize answers 503.
# Optional var: ALLOWED_ORIGINS (comma-separated browser origins to send CORS headers to; none by default).
