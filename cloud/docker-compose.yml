services:
  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-xtctx}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-xtctx}
      POSTGRES_DB: ${POSTGRES_DB:-xtctx}
    ports:
      - "127.0.0.1:${PG_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init-app-role.sql:/docker-entrypoint-initdb.d/01-init-app-role.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-xtctx} -d ${POSTGRES_DB:-xtctx}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ..
      dockerfile: cloud/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:${PORT:-8788}:8788"
    environment:
      HOST: 0.0.0.0
      PORT: 8788
      DATABASE_URL: postgresql://${POSTGRES_USER:-xtctx}:${POSTGRES_PASSWORD:-xtctx}@postgres:5432/${POSTGRES_DB:-xtctx}
      DATABASE_APP_ROLE: ${DATABASE_APP_ROLE:-xtctx_app}
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8788}
      JWT_SECRET: ${JWT_SECRET:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      ALLOWED_GITHUB_IDS: ${ALLOWED_GITHUB_IDS:-}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_PRICE_ID: ${STRIPE_PRICE_ID:-}
      HOSTED_MESSAGE_QUOTA: ${HOSTED_MESSAGE_QUOTA:-}
      MAX_UPLOAD_BODY_BYTES: ${MAX_UPLOAD_BODY_BYTES:-}
      MAX_UPLOAD_MESSAGE_BYTES: ${MAX_UPLOAD_MESSAGE_BYTES:-}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-local}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-}
      EMBEDDING_API_URL: ${EMBEDDING_API_URL:-}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
    volumes:
      - hf_cache:/data/hf-cache

  worker:
    build:
      context: ..
      dockerfile: cloud/Dockerfile
    profiles: ["worker"]
    restart: unless-stopped
    command: ["node", "dist/worker.mjs"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-xtctx}:${POSTGRES_PASSWORD:-xtctx}@postgres:5432/${POSTGRES_DB:-xtctx}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-local}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-}
      EMBEDDING_API_URL: ${EMBEDDING_API_URL:-}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      EMBEDDING_POLL_MS: ${EMBEDDING_POLL_MS:-2000}
    volumes:
      - hf_cache:/data/hf-cache

volumes:
  pgdata:
  hf_cache:
